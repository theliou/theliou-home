<!DOCTYPE html>
<!--
  ============================================================
  分享卡片源文件（og:image / 1200×630）
  ============================================================
  这不是网站页面，是"生成图片的模板"：用无头浏览器把它渲染成 assets/og-cover.jpg。
  重新生成：
    chrome --headless --window-size=1200,630 --screenshot=og-card.png og-card.html
    再把 PNG 转成 JPEG（照片用 PNG 会有 1MB+，JPEG 只要 100 多 KB）

  改文案就改下面 .card h1 / .card p 两行。
  卡片上的字是"应该出现"的 —— 和图里那句要修掉的英文不同，这里就是要让人读到。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
  *{ box-sizing:border-box; margin:0; }
  html,body{ width:1200px; height:630px; overflow:hidden; }
  .card{
    position:relative; width:1200px; height:630px; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:68px 76px 60px;
    background-color:#0A1E45;
    background-image:
      linear-gradient(180deg,
        rgba(4,16,40,.58) 0%, rgba(4,16,40,.22) 40%,
        rgba(4,16,40,.42) 70%, rgba(4,16,40,.84) 100%),
      url("assets/hero-sky-clean.jpg");
    background-size:cover, cover;
    background-position:center, 50% 62%;
    font-family:"IBM Plex Sans","Noto Sans SC",sans-serif;
    color:#fff;
  }
  .top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .site{ font-size:22px; letter-spacing:.01em; color:rgba(255,255,255,.86); }
  .gull{ width:112px; color:rgba(255,255,255,.92); margin-top:-14px; }
  .gull svg{ display:block; width:100%; height:auto; }
  h1{
    font-family:"Fraunces","Noto Serif SC",Georgia,serif;
    font-weight:700; font-size:104px; line-height:.95;
    letter-spacing:-.02em; text-shadow:0 3px 30px rgba(0,0,0,.3);
  }
  h1 .zh{ letter-spacing:0; }
  p{
    margin-top:22px; font-size:27px; line-height:1.5;
    color:rgba(255,255,255,.88); max-width:22em;
  }
  .rule{ height:1px; background:rgba(255,255,255,.85); margin-bottom:22px; }
  .meta{ display:flex; justify-content:space-between; align-items:baseline; gap:40px;
         font-size:19px; color:rgba(255,255,255,.7); }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="site">栗鸥 Lio · 个人主页</span>
      <span class="gull"><svg viewBox="0 0 64 30"><path d="M3 24 Q17 3 32 15 Q47 3 61 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg></span>
    </div>

    <div>
      <h1><span class="zh">栗鸥</span> Lio</h1>
      <p>计算机专业在读学生 · 现在在找暑期实习</p>
    </div>

    <div>
      <div class="rule"></div>
      <div class="meta">
        <span>项目 · 关于 · 技术栈 · 联系</span>
        <span>lio.example</span>
      </div>
    </div>
  </div>
</body>
</html>
