<!DOCTYPE html>
<!--
  ============================================================
  栗鸥 Lio · 首页（整屏照片 hero，不滚动）
  ============================================================

  这一页只做一件事：让访客在一屏之内记住"栗鸥"这个人，并且知道站里还有什么。
  所以它没有正文，hero 直接吃掉整个视口高度。首屏分三段：
    上方 = 名字（136px）+ 一行欢迎语
    中部 = 天空、云和海鸥
    下方 = 实线 + 四栏站点索引（项目 / 关于 / 技术栈 / 联系）

  【待填】搜索 待填 只有一处：首屏那句欢迎语。
         一句话说清「你是谁 + 在做什么 / 想要什么」，别写"热爱技术"这类空话。

  背景图用整张照片铺满（background-size: cover，任何屏幕都不会留白）。
  换图只改 site.css 顶部的 --hero-img 一行，三版都在 assets/ 里：
    assets/hero-sky-clean.jpg   ✅ 当前使用：整图，画面中间那句英文已修掉（1920×1080，77 KB）
    assets/hero-sky.jpg         原图（含英文 "BE JOYFUL ALWAYS"）
    assets/hero-sky-clouds.jpg  只留云层带（1920×447，41 KB）

  【海鸥】纯装饰性的互动彩蛋：点一下会飞走，约 0.9 秒后换个位置飞回来。
    实现是「真 button + CSS 变量定位 + 原生 JS」，没有依赖。
    加一只海鸥：复制一个 <button class="gull">，改行内的 --x/--y/--s/--d/--dx/--dy。
    想删掉整个互动：把 <div class="gulls"> 整块和页面底部 <script> 一起删掉即可。

  【为什么这么设计】（对照 Anthropic frontend-design 的 AI 味清单）
    · 无全大写 tracked 眉标、无装饰性 01/02/03、链接不加 → 箭头
    · 「大胆只花一处」= 首屏这行大字，其余交给照片
    · 照片上的白字靠一层渐变遮罩保证可读，不是靠运气
    · 海鸥只有一种动效（慢速漂浮）＋ 一个由用户触发的反馈（点击飞走），
      不是"每张卡都 hover 一下"那种散点式动效

  【部署到 Cloudflare】（2026 现状：新项目用 Workers，别新建 Pages）
    站点文件统一放进 public/ 再部署，别把 skills/ 和预览图传上去：
      public/index.html  public/*.html  public/site.css  public/assets/
      wrangler.jsonc: { "name": "lio-site", "compatibility_date": "2026-10-01",
                        "assets": { "directory": "./public" } }
      npx wrangler deploy
    → 静态请求免费且不限量；自定义域名在控制台 Custom domains 一键接入

  【图片版权提醒】
    这张壁纸来自网络（文件名带「哲风壁纸」）。个人主页是公开站点，
    用来源不明的图有风险；换成自己拍的 / Unsplash 等可商用图更稳妥。
-->

<script>
// 点击海鸥：飞走 → 换个位置 → 飞回来。
// 开启「减少动态效果」时不做动画，直接瞬移（避免无意义的位移）。
(function () {
  var gulls = [].slice.call(document.querySelectorAll('.gull'));
  if (!gulls.length) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  gulls.forEach(function (gull) {
    gull.addEventListener('click', function () {
      // 落点避开左上角的名字区域；大海鸥只在自己那片天空里换位置，
      // 否则它会随机飞到名字上面挡住字。
      var lead = gull.classList.contains('gull--lead');
      var x = (lead ? 68 + Math.random() * 22 : 18 + Math.random() * 72).toFixed(1);
      var y = (lead ? 24 + Math.random() * 26 : 32 + Math.random() * 32).toFixed(1);

      if (reduce.matches) {
        gull.style.setProperty('--x', x + '%');
        gull.style.setProperty('--y', y + '%');
        return;
      }
      if (gull.classList.contains('away')) return;

      gull.classList.add('away');
      window.setTimeout(function () {
        gull.style.setProperty('--x', x + '%');
        gull.style.setProperty('--y', y + '%');
        // 摘掉 away 之后，基础样式里的入场动画会重新播放一次 ——
        // 所以"飞回来"不需要单独写一个返回动画，行为也统一。
        gull.classList.remove('away');
      }, 880);
    });
  });
})();
</script>
