<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{ margin:0; background:#fff; }</style>
</head>
<body>
  <!-- 用固定像素尺寸，不用 vw/vh：Chrome 无头模式窗口最小宽度是 500px，
       100vw 会拿到 500 而不是 32，SVG 就被居中到画布中间了。 -->
  <svg width="32" height="32" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" rx="13" fill="#0A1E45"/>
    <path d="M8 40 Q18 15 32 32 Q46 15 56 40"
          fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round"/>
  </svg>
</body>
</html>
