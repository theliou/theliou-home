<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{ margin:0; background:#fff; }</style>
</head>
<body>
  <!-- iOS 主屏图标：系统会自己切圆角，所以这里是纯方块（不加 rx），
       并把 viewBox 外扩 4 个单位留出约 6% 安全边。 -->
  <svg width="180" height="180" viewBox="-4 -4 72 72" xmlns="http://www.w3.org/2000/svg">
    <rect x="-4" y="-4" width="72" height="72" fill="#0A1E45"/>
    <path d="M8 40 Q18 15 32 32 Q46 15 56 40"
          fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round"/>
  </svg>
</body>
</html>
